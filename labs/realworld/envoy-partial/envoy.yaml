static_resources:
  listeners:
    - name: http
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/api/"}
                          route: {cluster: api_cluster}
                        - match: {prefix: "/missing/"}
                          route: {cluster: ghost_cluster}
  clusters:
    - name: api_cluster
      type: STRICT_DNS
      load_assignment:
        cluster_name: api_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: api.internal, port_value: 9090}
