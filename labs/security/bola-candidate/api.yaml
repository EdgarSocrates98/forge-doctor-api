openapi: "3.0.3"
info:
  title: Users API
  version: "1.0"
paths:
  /users/{id}:
    get:
      operationId: getUser
      summary: fetch a user profile
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  email: {type: string}
