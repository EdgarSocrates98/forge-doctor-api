asyncapi: "3.0.0"
info:
  title: Events
  version: "1.0"
channels:
  orderPlaced:
    address: orders.placed
    messages:
      OrderPlaced:
        correlationId: {location: "$message.header#/correlationId"}
        payload:
          type: object
          properties:
            orderId: {type: string}
operations:
  onOrderPlaced:
    action: receive
    channel:
      $ref: '#/channels/orderPlaced'
    bindings:
      amqp: {is: routingKey}
