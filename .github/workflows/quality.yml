# Spec 035: independent quality gate — tests, lint, types, build,
# packaging smoke, lab, offline/determinism proof on the Python matrix.
name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff mypy types-PyYAML build
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy src
      - name: Build
        run: python -m build
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/wheelsmoke
          /tmp/wheelsmoke/bin/pip install dist/*.whl
          /tmp/wheelsmoke/bin/forge-doctor-api --version
      - name: CLI smoke
        run: |
          forge-doctor-api scan labs/golden/fastapi-service --format agent
          forge-doctor-api contract inspect labs/golden/fastapi-service
      - name: Forge Lab
        run: forge-doctor-api lab --no-record
