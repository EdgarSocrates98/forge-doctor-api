# Spec 069: release pipeline — build, SBOM, sums, provenance, draft
# release. Never auto-publishes; a human approves the draft.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # draft release creation
  id-token: write        # OIDC for build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Generate SBOM (CycloneDX 1.5)
        run: python factory/sbom.py --out dist/sbom.cdx.json
      - name: SHA-256 sums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
