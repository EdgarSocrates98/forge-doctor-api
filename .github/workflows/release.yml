# Spec 069: release pipeline — build, SBOM, sums, provenance, draft
# release. Never auto-publishes; a human approves the draft.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # draft release creation
  id-token: write        # OIDC for build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel + sdist
        run: python -m build
      - name: Generate SBOM (CycloneDX 1.5)
        run: python factory/sbom.py --out dist/sbom.cdx.json
      - name: SHA-256 sums
        run: |
          python factory/sha256sums.py
          python factory/sha256sums.py --verify
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
