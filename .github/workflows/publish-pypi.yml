name: publish-pypi

# Trusted Publishing (OIDC) — sem token armazenado.
# Requer: publisher registrado no PyPI apontando para
#   owner/repo: <org>/<repo>  workflow: publish-pypi.yml  environment: (vazio)
# Para projetos ainda nao criados, use "pending publisher" — o primeiro
# publish confiavel cria o projeto. Disparo manual: gh workflow run publish-pypi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    # Disabled until the PyPI trusted publisher exists — flip `if: false` to enable.
    if: true
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC token for PyPI trusted publishing
      attestations: write    # PEP 740 artifact attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: python -m pip install --quiet build && python -m build
      - name: Publish to PyPI (trusted publishing + attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
