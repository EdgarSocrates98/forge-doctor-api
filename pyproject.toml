[project]
name = "forge-doctor-api"
version = "0.1.0"
description = "Deterministic, offline-first, evidence-first API architecture intelligence engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Edgar Sócrates Caria" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
graphql = ["graphql-core>=3.2,<4"]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
forge-doctor-api = "forge_doctor_api.cli:main"

[tool.poetry]
packages = [{ include = "forge_doctor_api", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"
mypy = ">=1.10"
types-PyYAML = ">=6.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["factory", "docs", ".claude", "labs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["forge_doctor_api"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["forge_doctor_api.handoff.mcp_server"]
disallow_untyped_decorators = false
